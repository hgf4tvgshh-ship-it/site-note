in-bottom:18px}.tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 12px}.tab{flex:none;padding:10px 16px;background:#e8eeeb;border-radius:99px;color:#42534d}.tab.active{background:var(--ink);color:white}.empty{padding:30px 16px;border-radius:18px;border:1px dashed #cad9d0;color:var(--muted);text-align:center}.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photo-card{background:white;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.photo-card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e8ece8;display:block}.photo-info{padding:12px}.photo-info strong{display:block;font-size:14px}.photo-info small{color:var(--muted)}.form-col{display:grid;gap:7px;margin-bottom:15px}label{font-size:13px;font-weight:700}input:not([type=file]),textarea,select{width:100%;border:1px solid #dce4de;background:white;border-radius:12px;padding:13px;color:var(--ink)}textarea{min-height:90px;resize:vertical}.modal-bg{position:fixed;inset:0;background:#1423219c;z-index:20;display:flex;justify-content:center;align-items:end}.modal{background:#fff;max-height:94dvh;overflow:auto;width:min(100%,720px);padding:22px;border-radius:22px 22px 0 0}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.close{border-radius:50%;background:#f0f3f0;width:36px;height:36px}.hidden{display:none!important}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 15px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:5}.nav{background:none;color:#73817a;font-size:12px;display:grid;gap:4px;place-items:center;min-width:65px}.nav span{font-size:23px}.nav.active{color:var(--accent);font-weight:800}.camera-view{position:relative;background:#101615;border-radius:15px;overflow:hidden}.camera-view video{display:block;width:100%;max-height:48vh;object-fit:cover}.draw{width:100%;touch-action:none;display:block;border-radius:12px;background:#edf0ed;max-height:58vh;object-fit:contain}.tools{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}.tools button{padding:9px 12px;border-radius:10px;background:#f0f4f0}.tools button.active{background:#cce8da}.note{font-size:12px;color:var(--muted);line-height:1.6}.item{padding:14px;border-radius:15px;background:white;border:1px solid var(--line);margin-bottom:10px}.report-photo{width:100%;max-width:250px;border-radius:8px}.status-requested{background:#fff3e3;color:#98600d}.status-progress{background:#e7f0fc;color:#28679c}.status-done{background:#def2e8;color:#1a7753}.danger{color:#b83e35}.btn-delete{background:#fff3f2;color:#a53630;border:1px solid #f0c7c3;border-radius:12px;padding:10px 12px;font-weight:700}.btn-delete:disabled{opacity:.4;cursor:not-allowed}.audio{width:100%;margin:8px 0}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:15px 0}.noprint{}@media(min-width:700px){.photo-grid{grid-template-columns:repeat(3,1fr)}.modal-bg{align-items:center}.modal{border-radius:22px}.grid{grid-template-columns:repeat(4,1fr)}}@media print{body{background:white}.top,.footer,.noprint,.back,.tabs,.btn,.btn-light,.btn-outline{display:none!important}.shell{max-width:none;padding:0}#report-print{display:block!important}.report-page{break-inside:avoid;margin-bottom:22px}.report-photo{max-width:180px}}

'use strict';const $=s=>document.querySelector(s), app=$('#app'), overlay=$('#overlay'), modal=$('#modal');let db,view='home',projectId=null,tab='photos',cameraStream=null,recorder=null,recordChunks=[],drawState=null;let projects=[],photos=[],notes=[],tasks=[],audios=[];const uid=()=>crypto.randomUUID?.()||'id'+Date.now()+Math.random().toString(16).slice(2);const date=()=>new Date().toISOString().slice(0,10);const fmt=t=>new Date(t).toLocaleString('ko-KR');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){alert(s)}
const schema=['projects','photos','notes','tasks','audios'];function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('site-note-db',1);r.onupgradeneeded=()=>schema.forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function tx(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function request(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function getAll(n){return request(tx(n).getAll())}async function put(n,o){await request(tx(n,'readwrite').put(o));await refresh()}async function del(n,id){await request(tx(n,'readwrite').delete(id));await refresh()}async function refresh(){[projects,photos,notes,tasks,audios]=await Promise.all(schema.map(getAll));render()}
function showModal(html){modal.innerHTML=`<div class="modal-head"><h2>${html.title}</h2><button class="close" onclick="closeModal()">✕</button></div>${html.body}`;overlay.classList.remove('hidden')}function closeModal(){overlay.classList.add('hidden');if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}drawState=null}overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});$('#today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'});
function go(v){view=v;projectId=null;render()}function openProject(id){projectId=id;view='project';tab='photos';render()}function nav(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.nav===view||(view==='project'&&n.dataset.nav==='home')))}function render(){nav();if(view==='home')return home();if(view==='project')return project();if(view==='tasks')return taskPage();if(view==='backup')return backupPage()}
function home(){let active=tasks.filter(t=>t.status!=='완료').length;app.innerHTML=`<div class="hero"><div><div class="muted small">현장의 모든 기록을 한곳에</div><h1>나의 현장</h1><div class="muted small">사진 · 스케치 · 작업일지 · 보수관리</div></div><button class="btn" onclick="newProject()">+ 현장 추가</button></div><div class="grid"><div class="metric"><span class="muted small">전체 현장</span><strong>${projects.length}</strong></div><div class="metric"><span class="muted small">보관 사진</span><strong>${photos.length}</strong></div><div class="metric"><span class="muted small">미완료 보수</span><strong>${active}</strong></div><div class="metric"><span class="muted small">현장 기록</span><strong>${notes.length}</strong></div></div><div class="section-title"><h2>프로젝트</h2><span class="muted small">최근 생성 순</span></div>${projects.length?projects.slice().sort((a,b)=>b.created-a.created).map(p=>`<div class="project" onclick="openProject('${p.id}')"><div class="project-top"><h3>${esc(p.name)}</h3><div class="row"><span class="pill">${esc(p.status||'진행중')}</span><button class="btn-delete small" aria-label="${esc(p.name)} 삭제" onclick="event.stopPropagation();deleteProjectPrompt('${p.id}')">삭제</button></div></div><p class="muted small">${esc(p.address||'주소 미입력')} · ${esc(p.period||'공사기간 미입력')}</p><div class="row small muted"><span>사진 ${photos.filter(x=>x.projectId===p.id).length}장</span><span>·</span><span>기록 ${notes.filter(x=>x.projectId===p.id).length}건</span><span>·</span><span>보수 ${tasks.filter(x=>x.projectId===p.id&&x.status!=='완료').length}건</span></div></div>`).join(''):`<div class="empty">아직 등록된 현장이 없습니다.<p>첫 번째 프로젝트를 등록해 주세요.</p><button class="btn" onclick="newProject()">+ 첫 현장 만들기</button></div>`}`}
function newProject(){showModal({title:'새 프로젝트',body:`<form id="projectForm"><div class="form-col"><label>현장명 *</label><input name="name" maxlength="80" required placeholder="예: 상무동 카페 리뉴얼"></div><div class="form-col"><label>현장 주소</label><input name="address" placeholder="예: 광주 서구 ..."></div><div class="form-col"><label>공사기간</label><input name="period" placeholder="예: 2026.11.20 ~ 2026.12.20"></div><div class="form-col"><label>담당자</label><input name="manager" placeholder="이름 또는 팀"></div><button class="btn" style="width:100%">프로젝트 저장</button></form>`});$('#projectForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),id=uid();await put('projects',{id,name:f.get('name').trim(),address:f.get('address').trim(),period:f.get('period').trim(),manager:f.get('manager').trim(),status:'진행중',created:Date.now()});closeModal();openProject(id)}}
function deleteProjectPrompt(id){const p=projects.find(x=>x.id===id);if(!p)return;const cp=photos.filter(x=>x.projectId===id).length,cn=notes.filter(x=>x.projectId===id).length,ct=tasks.filter(x=>x.projectId===id).length,ca=audios.filter(x=>x.projectId===id).length;showModal({title:'프로젝트 삭제',body:`<div class="item" style="background:#fff8f6;border-color:#f0c7c3"><strong>${esc(p.name)}</strong><p class="danger">삭제하면 이 프로젝트의 사진 ${cp}장, 작업일지 ${cn}건, 보수 기록 ${ct}건, 음성 ${ca}건도 함께 삭제되며 되돌릴 수 없습니다.</p><p class="note">삭제 전 최신 백업 파일이 iCloud Drive에 저장되어 있는지 확인해 주세요. 삭제해도 기존 iCloud 백업 파일은 자동으로 바뀌거나 삭제되지 않습니다.</p></div><div class="form-col"><label for="confirmDeleteName">실수로 삭제하지 않도록 프로젝트명 그대로 입력하세요.</label><input id="confirmDeleteName" autocomplete="off" placeholder="${esc(p.name)}"></div><div class="row"><button class="btn-delete" id="confirmProjectDelete" disabled>프로젝트와 관련 기록 삭제</button><button class="btn-outline" onclick="closeModal()">취소</button></div>`});const input=$('#confirmDeleteName'),button=$('#confirmProjectDelete');input.addEventListener('input',()=>button.disabled=input.value.trim()!==p.name);button.onclick=async()=>{button.disabled=true;button.textContent='삭제 중...';try{await deleteProjectAndContents(id);closeModal();projectId=null;view='home';await refresh();toast('프로젝트와 관련 기록을 삭제했습니다.')}catch(e){button.textContent='프로젝트와 관련 기록 삭제';button.disabled=false;toast('삭제 실패: '+e.message)}}}
function deleteProjectAndContents(id){return new Promise((resolve,reject)=>{let transaction;try{transaction=db.transaction(schema,'readwrite');for(const name of schema){const store=transaction.objectStore(name);if(name==='projects'){store.delete(id)}else{const entries=({photos,notes,tasks,audios})[name].filter(item=>item.projectId===id);for(const entry of entries)store.delete(entry.id)}}transaction.oncomplete=()=>resolve();transaction.onerror=()=>reject(transaction.error||new Error('저장소 오류'));transaction.onabort=()=>reject(transaction.error||new Error('작업 취소'))}catch(e){if(transaction)try{transaction.abort()}catch(_){}reject(e)}})}
function project(){let p=projects.find(x=>x.id===projectId);if(!p){go('home');return}let ps=photos.filter(x=>x.projectId===projectId).sort((a,b)=>b.created-a.created),ns=notes.filter(x=>x.projectId===projectId).sort((a,b)=>b.created-a.created),ts=tasks.filter(x=>x.projectId===projectId).sort((a,b)=>b.created-a.created),as=audios.filter(x=>x.projectId===projectId).sort((a,b)=>b.created-a.created);app.innerHTML=`<button class="back" onclick="go('home')">← 전체 프로젝트</button><div class="hero"><div><div class="muted small">PROJECT / ${new Date(p.created).getFullYear()}</div><h1>${esc(p.name)}</h1><div class="muted small">${esc(p.address||'주소 미입력')} ${p.manager?'· 담당 '+esc(p.manager):''}</div></div><div class="row"><button class="btn-outline" onclick="makeReport('${p.id}')">PDF 보고서</button><button class="btn-delete" onclick="deleteProjectPrompt('${p.id}')">프로젝트 삭제</button></div></div><div class="row" style="margin-bottom:18px"><button class="btn" onclick="launchCamera()">📷 사진 촬영</button><button class="btn-light" onclick="$('#importPhoto').click()">사진 가져오기</button></div><div class="tabs"><button class="tab ${tab==='photos'?'active':''}" onclick="setTab('photos')">사진 ${ps.length}</button><button class="tab ${tab==='notes'?'active':''}" onclick="setTab('notes')">작업일지 ${ns.length}</button><button class="tab ${tab==='tasks'?'active':''}" onclick="setTab('tasks')">보수 ${ts.length}</button><button class="tab ${tab==='audio'?'active':''}" onclick="setTab('audio')">음성 ${as.length}</button></div><div id="contents"></div>`;let box=$('#contents');if(tab==='photos')box.innerHTML=ps.length?`<div class="photo-grid">${ps.map(o=>`<div class="photo-card"><img alt="현장 사진" src="${o.preview||o.original}" onclick="openPhoto('${o.id}')"><div class="photo-info"><strong>${esc(o.label||'현장 사진')}</strong><small>${fmt(o.created)} · ${esc(o.trade||'미분류')}</small><div class="row" style="margin-top:10px"><button class="btn-light small" onclick="openPhoto('${o.id}')">스케치·기록</button></div></div></div>`).join('')}</div>`:`<div class="empty">사진이 없습니다.<p>앱 카메라로 촬영하면 기본 사진 앨범 저장 없이 앱에 보관합니다.</p></div>`;if(tab==='notes')box.innerHTML=`<div class="bar"><span class="muted small">날짜별 작업 내용</span><button class="btn" onclick="newNote()">+ 작업일지</button></div>${ns.length?ns.map(n=>`<div class="item"><strong>${esc(n.title)}</strong><span class="pill" style="margin-left:8px">${esc(n.trade)}</span><p>${esc(n.content).replace(/\n/g,'<br>')}</p><div class="row space"><small class="muted">${fmt(n.created)}</small><button class="btn-outline small danger" onclick="removeItem('notes','${n.id}')">삭제</button></div></div>`).join(''):'<div class="empty">아직 작성한 작업일지가 없습니다.</div>'}`;if(tab==='tasks')box.innerHTML=`<div class="bar"><span class="muted small">수정 요청·진행·완료 이력</span><button class="btn" onclick="newTask()">+ 보수 요청</button></div>${ts.length?ts.map(taskHTML).join(''):'<div class="empty">등록된 보수 요청이 없습니다.</div>'}`;if(tab==='audio')box.innerHTML=`<div class="bar"><span class="muted small">녹음 파일은 앱 안에 저장됩니다.</span><button class="btn" onclick="newAudio()">+ 음성 기록</button></div>${as.length?as.map(audioHTML).join(''):'<div class="empty">등록된 음성 메모가 없습니다.</div>'}`}
function setTab(t){tab=t;render()}async function launchCamera(){showModal({title:'현장 사진 촬영',body:`<div class="camera-view"><video id="camera" autoplay playsinline muted></video></div><div class="row" style="margin-top:15px"><button class="btn" id="snap">촬영·앱에 저장</button><button class="btn-outline" onclick="closeModal()">취소</button></div><p class="note">HTTPS 환경과 카메라 권한이 필요합니다. 사진 앱으로 자동 내보내지 않습니다.</p>`});try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('#camera').srcObject=cameraStream;$('#snap').onclick=async()=>{const v=$('#camera'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;if(!c.width)return toast('카메라 준비 중입니다.');c.getContext('2d').drawImage(v,0,0);let data=c.toDataURL('image/jpeg',.82);await savePhoto(data);closeModal()}}catch(e){modal.querySelector('.camera-view').innerHTML='<p style="color:white;padding:20px">카메라 권한이 없거나 지원되지 않습니다.</p>';$('#snap').disabled=true}}
async function savePhoto(data){await put('photos',{id:uid(),projectId,original:data,preview:null,label:'현장 사진',trade:'미분류',memo:'',created:Date.now()});tab='photos';render()}$('#importPhoto').onchange=async e=>{let f=e.target.files[0];if(!f||!projectId)return;const r=new FileReader();r.onload=async()=>{await savePhoto(r.result);e.target.value=''};r.readAsDataURL(f)};
function openPhoto(id){let p=photos.find(x=>x.id===id);if(!p)return;showModal({title:'사진 스케치·시공 기록',body:`<canvas id="drawCanvas" class="draw"></canvas><div class="tools"><button id="penBtn" class="active" onclick="tool('pen')">펜</button><button id="arrowBtn" onclick="tool('arrow')">화살표</button><button onclick="undo()">↶ 실행 취소</button><label>색상 <input id="penColor" type="color" value="#e43636" style="vertical-align:middle;width:40px;height:34px"></label><label>굵기 <input id="penWidth" type="range" min="2" max="18" value="5" style="vertical-align:middle;width:85px"></label></div><div class="form-col"><label>사진명</label><input id="photoLabel" value="${esc(p.label)}"></div><div class="form-col"><label>공종</label><select id="photoTrade">${['미분류','철거','목공','전기','설비','도장','타일','금속','가구','마감','기타'].map(x=>`<option ${p.trade===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-col"><label>현장 메모</label><textarea id="photoMemo" placeholder="치수, 문제점, 요청사항">${esc(p.memo)}</textarea></div><div class="row"><button class="btn" onclick="saveMarked('${id}')">스케치·기록 저장</button><button class="btn-outline" onclick="downloadPhoto('${id}')">사진 내보내기</button><button class="btn-outline danger" onclick="removePhoto('${id}')">삭제</button></div><p class="note">원본은 유지되고 스케치본은 별도로 보관됩니다. 치수는 실제 측정값을 메모로 남겨주세요.</p>`});setupDraw(p.preview||p.original)}
function setupDraw(src){let canvas=$('#drawCanvas'),ctx=canvas.getContext('2d');const im=new Image;im.onload=()=>{let max=1300,scale=Math.min(1,max/Math.max(im.width,im.height));canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);ctx.drawImage(im,0,0,canvas.width,canvas.height);drawState={canvas,ctx,history:[canvas.toDataURL()],mode:'pen',drawing:false,start:null}};im.src=src;canvas.onpointerdown=e=>{if(!drawState)return;canvas.setPointerCapture(e.pointerId);let p=pos(e,canvas);drawState.drawing=true;drawState.start=p;drawState.base=ctx.getImageData(0,0,canvas.width,canvas.height);if(drawState.mode==='pen'){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);styleDraw(ctx);ctx.stroke()}};canvas.onpointermove=e=>{if(!drawState?.drawing)return;let p=pos(e,canvas);if(drawState.mode==='pen'){styleDraw(ctx);ctx.lineTo(p.x,p.y);ctx.stroke()}else{ctx.putImageData(drawState.base,0,0);drawArrow(ctx,drawState.start,p)}};canvas.onpointerup=e=>{if(!drawState?.drawing)return;if(drawState.mode==='arrow'){ctx.putImageData(drawState.base,0,0);drawArrow(ctx,drawState.start,pos(e,canvas))}drawState.drawing=false;drawState.history.push(canvas.toDataURL())}}function pos(e,c){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function styleDraw(c){c.strokeStyle=$('#penColor').value;c.fillStyle=$('#penColor').value;c.lineWidth=Number($('#penWidth').value)*Math.max(1,c.width/750);c.lineCap='round';c.lineJoin='round'}function drawArrow(c,a,b){styleDraw(c);let ang=Math.atan2(b.y-a.y,b.x-a.x),len=22*c.lineWidth/5;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.moveTo(b.x-len*Math.cos(ang-.5),b.y-len*Math.sin(ang-.5));c.lineTo(b.x,b.y);c.lineTo(b.x-len*Math.cos(ang+.5),b.y-len*Math.sin(ang+.5));c.stroke()}function tool(x){if(!drawState)return;drawState.mode=x;$('#penBtn').classList.toggle('active',x==='pen');$('#arrowBtn').classList.toggle('active',x==='arrow')}function undo(){if(!drawState||drawState.history.length<2)return;drawState.history.pop();let im=new Image;im.onload=()=>{drawState.ctx.clearRect(0,0,drawState.canvas.width,drawState.canvas.height);drawState.ctx.drawImage(im,0,0)};im.src=drawState.history.at(-1)}async function saveMarked(id){let p=photos.find(x=>x.id===id);if(!p||!drawState)return;p.preview=drawState.canvas.toDataURL('image/jpeg',.85);p.label=$('#photoLabel').value;p.trade=$('#photoTrade').value;p.memo=$('#photoMemo').value;await put('photos',p);closeModal()}function downloadFile(s,name){let a=document.createElement('a');a.href=s;a.download=name;a.click()}function downloadPhoto(id){let p=photos.find(x=>x.id===id);if(p)downloadFile(p.preview||p.original,'site-note-'+id+'.jpg')}async function removePhoto(id){if(!confirm('이 사진을 삭제하시겠습니까?'))return;await del('photos',id);closeModal()}
function newNote(){showModal({title:'새 작업일지',body:`<form id="noteForm"><div class="form-col"><label>작업 제목 *</label><input name="title" required placeholder="예: 목공 천장틀 설치"></div><div class="form-col"><label>공종</label><select name="trade">${['철거','목공','전기','설비','도장','타일','금속','가구','마감','기타'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-col"><label>작업 내용·특이사항</label><textarea name="content" required placeholder="작업 진도, 문제점, 조치 내용"></textarea></div><button class="btn" style="width:100%">작업일지 저장</button></form>`});$('#noteForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget);await put('notes',{id:uid(),projectId,title:f.get('title'),trade:f.get('trade'),content:f.get('content'),created:Date.now()});closeModal()}}
function newTask(){if(!projectId){toast('먼저 현장을 선택해 주세요.');return}showModal({title:'보수·수정 요청',body:`<form id="taskForm"><div class="form-col"><label>요청 내용 *</label><input name="title" required placeholder="예: 카운터 측면 마감 보수"></div><div class="form-col"><label>위치·담당자</label><input name="owner" placeholder="예: 1층 홀 / 목공팀"></div><div class="form-col"><label>상세 내용</label><textarea name="content"></textarea></div><button class="btn" style="width:100%">요청 등록</button></form>`});$('#taskForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget);await put('tasks',{id:uid(),projectId,title:f.get('title'),owner:f.get('owner'),content:f.get('content'),status:'요청',created:Date.now()});closeModal()}}

function newAudio(){showModal({title:'음성 현장 메모',body:`<div class="form-col"><label>음성 메모 제목</label><input id="audioTitle" placeholder="예: 2층 설비 협의"></div><div class="row"><button class="btn" id="startRec" onclick="startRecording()">● 녹음 시작</button><button class="btn-outline" id="stopRec" onclick="stopRecording()" disabled>■ 녹음 종료·저장</button></div><p class="note" id="audioStatus">마이크 권한이 필요합니다. 녹음 데이터는 이 앱의 내부 저장공간에 보관합니다.</p><div class="form-col"><label>메모·받아쓰기 텍스트(수동 입력 가능)</label><textarea id="audioText" placeholder="녹음 내용 요약 또는 음성 인식 결과"></textarea></div><button class="btn-light" id="speechBtn" onclick="speechToText()">지원되는 브라우저에서 음성 → 텍스트 시도</button><p class="note">아이폰 Safari에서는 브라우저 음성 인식 기능이 제공되지 않을 수 있습니다. 음성 파일 녹음과 자동 문자 변환은 별개입니다.</p>`})}async function startRecording(){try{if(!window.MediaRecorder)throw Error('이 브라우저는 녹음을 지원하지 않습니다.');let stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=async()=>{let blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/mp4'});let r=new FileReader();r.onload=async()=>{await put('audios',{id:uid(),projectId,title:$('#audioTitle')?.value||'음성 메모',text:$('#audioText')?.value||'',data:r.result,created:Date.now()});closeModal()};r.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};recorder.start();$('#audioStatus').textContent='녹음 중입니다.';$('#startRec').disabled=true;$('#stopRec').disabled=false}catch(e){toast('녹음 시작 실패: '+e.message)}}function stopRecording(){if(recorder?.state==='recording')recorder.stop()}function speechToText(){let Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec)return toast('이 브라우저에서는 자동 문자 변환을 지원하지 않습니다. 텍스트를 직접 기록해 주세요.');let r=new Rec;r.lang='ko-KR';r.onresult=e=>{$('#audioText').value+=e.results[0][0].transcript};r.onerror=e=>toast('음성 인식 실패: '+e.error);r.start()}function audioHTML(a){return `<div class="item"><strong>${esc(a.title)}</strong><p class="muted small">${fmt(a.created)}</p><audio class="audio" controls src="${a.data}"></audio><p>${esc(a.text||'').replace(/\n/g,'<br>')}</p><button class="btn-outline small danger" onclick="removeItem('audios','${a.id}')">삭제</button></div>`}
function reportProjectBlock(p){
  const id=p.id;
  const ps=photos.filter(x=>x.projectId===id).sort((a,b)=>a.created-b.created);
  const ns=notes.filter(x=>x.projectId===id).sort((a,b)=>a.created-b.created);
  const ts=tasks.filter(x=>x.projectId===id).sort((a,b)=>a.created-b.created);
  const aud=audios.filter(x=>x.projectId===id).sort((a,b)=>a.created-b.created);
  const content=x=>esc(x||'').replace(/\n/g,'<br>');
  const noContent=label=>`<p class="empty-report">${label}이(가) 없습니다.</p>`;
  const imageHTML=ps.length?`<div class="photo-grid-report">${ps.map((x,i)=>`<article class="photo-entry"><img src="${esc(x.preview||x.original||'')}" alt="현장 사진 ${i+1}"><div class="photo-caption"><strong>${i+1}. ${esc(x.label||'현장 사진')}</strong><div>${esc(x.trade||'미분류')} · ${fmt(x.created)}</div>${x.memo?`<p>${content(x.memo)}</p>`:''}</div></article>`).join('')}</div>`:noContent('현장 사진');
  const noteHTML=ns.length?ns.map(x=>`<article class="record"><div class="record-head"><strong>${esc(x.title||'작업 기록')}</strong><span>${esc(x.trade||'')} · ${fmt(x.created)}</span></div><p>${content(x.content)}</p></article>`).join(''):noContent('작업일지');
  const taskHTML=ts.length?ts.map(x=>`<article class="record"><div class="record-head"><strong>${esc(x.title||'보수 기록')}</strong><span>${esc(x.status||'요청')}</span></div><p>${content(x.content)}</p><small>${esc(x.owner||'담당 미정')} · ${fmt(x.created)}</small></article>`).join(''):noContent('보수 기록');
  const audioHTML=aud.length?aud.map(x=>`<article class="record"><div class="record-head"><strong>${esc(x.title||'음성 메모')}</strong><span>${fmt(x.created)}</span></div><p>${x.text?content(x.text):'텍스트 기록이 없습니다. (음성 파일은 PDF에 포함되지 않습니다.)'}</p></article>`).join(''):noContent('음성 메모 텍스트');
  return `<section class="site-report"><div class="site-label">SITE NOTE / FIELD REPORT</div><h1>${esc(p.name)}</h1><div class="subtitle">현장 시공 기록 보고서</div><dl class="metadata"><div><dt>현장 주소</dt><dd>${esc(p.address||'미입력')}</dd></div><div><dt>공사기간</dt><dd>${esc(p.period||'미입력')}</dd></div><div><dt>담당자</dt><dd>${esc(p.manager||'미입력')}</dd></div><div><dt>작성일</dt><dd>${date()}</dd></div></dl><div class="counts"><span>사진 <b>${ps.length}</b></span><span>작업일지 <b>${ns.length}</b></span><span>보수 기록 <b>${ts.length}</b></span><span>음성 <b>${aud.length}</b></span></div><h2>01 / 현장 사진</h2>${imageHTML}<h2>02 / 작업일지</h2>${noteHTML}<h2>03 / 보수 관리</h2>${taskHTML}${aud.length?`<h2>04 / 음성 메모 텍스트</h2>${audioHTML}`:''}</section>`;
}
function makeReport(id){
  const selected=id==='all'?projects.slice().sort((a,b)=>b.created-a.created):projects.filter(p=>p.id===id);
  if(!selected.length){toast('PDF 보고서로 저장할 프로젝트가 없습니다. 먼저 프로젝트를 등록해 주세요.');return}
  const reportName=id==='all'?'전체 현장 기록':selected[0].name;
  const reportHTML=selected.map(reportProjectBlock).join('');
  const win=window.open('','_blank');
  if(!win){toast('보고서 창을 열 수 없습니다. Safari 팝업 차단 설정을 확인하거나 Safari에서 현장노트를 열어 주세요.');return}

  win.document.open();
  win.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(reportName)} - 현장노트 보고서</title><style>
  :root{color-scheme:light}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f2f5f3;color:#21302b;margin:0}p{line-height:1.55}.print-tools{background:#19332b;color:white;padding:17px 18px}.print-tools .wrap{max-width:900px;margin:auto}.print-tools p{font-size:13px;margin:8px 0 0;color:#e1eee8}.print-button{background:#e2f2e8;color:#132820;border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer}main{max-width:900px;margin:22px auto;padding:0 15px 50px}.site-report{padding:34px;background:white;margin:0 auto 25px;border:1px solid #e8ece9;border-radius:16px;box-shadow:0 5px 30px #00000008}.site-label{font-size:11px;letter-spacing:2.5px;font-weight:800;color:#2a7560}.site-report h1{font-size:28px;line-height:1.25;margin:10px 0 3px;overflow-wrap:anywhere}.subtitle{color:#6d8078;margin:0 0 24px;font-size:13px}.metadata{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid #e8ece9;border-bottom:1px solid #e8ece9;margin:0;padding:12px 0}.metadata>div{padding:7px}.metadata dt{font-size:11px;color:#73837d;margin-bottom:4px}.metadata dd{font-size:13px;margin:0;overflow-wrap:anywhere}.counts{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 25px}.counts span{background:#eef6f1;padding:9px 13px;border-radius:10px;font-size:12px}.site-report h2{font-size:17px;margin:32px 0 14px;padding:0 0 9px;border-bottom:1px solid #cddad2;break-after:avoid}.photo-grid-report{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;align-items:start}.photo-entry{border:1px solid #e2e9e4;border-radius:10px;overflow:hidden;break-inside:avoid;page-break-inside:avoid}.photo-entry img{display:block;width:100%;max-height:300px;aspect-ratio:4/3;object-fit:contain;background:white}.photo-caption{padding:12px;font-size:12px;overflow-wrap:anywhere}.photo-caption strong{display:block;font-size:13px;margin-bottom:4px}.photo-caption div,.record small{color:#697970;font-size:11px}.photo-caption p{margin:8px 0 0;white-space:normal}.record{border-bottom:1px solid #e9eeeb;padding:10px 3px;break-inside:avoid;page-break-inside:avoid}.record-head{display:flex;gap:9px;justify-content:space-between;align-items:flex-start}.record-head strong{font-size:13px}.record-head span{font-size:11px;color:#78877d;text-align:right}.record p{font-size:12px;margin:7px 0}.empty-report{color:#87968c;font-size:12px;padding:8px 0}.tip{margin-top:12px;font-size:12px;line-height:1.5;color:#d4e8dc} @page{size:A4;margin:14mm} @media(max-width:550px){.site-report{padding:19px}.site-report h1{font-size:23px}.photo-grid-report{grid-template-columns:1fr}.metadata{grid-template-columns:1fr}.record-head{display:block}.record-head span{display:block;text-align:left;margin-top:3px}} @media print{body{background:white;color:#111}.print-tools{display:none!important}main{margin:0;padding:0;max-width:none}.site-report{box-shadow:none;border:0;border-radius:0;margin:0;padding:0;break-after:page}.site-report:last-child{break-after:auto}.photo-grid-report{grid-template-columns:repeat(2,minmax(0,1fr))}.metadata{grid-template-columns:repeat(2,minmax(0,1fr))}.site-report h2{margin-top:25px}.counts span{background:#eef6f1!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style></head><body><header class="print-tools"><div class="wrap"><button class="print-button" onclick="window.print()">인쇄 / PDF 저장</button><p><b>아이폰:</b> 인쇄 / PDF 저장 → 인쇄 미리보기의 공유 버튼 → 파일에 저장 → iCloud Drive → 현장노트. 표시가 다르면 Safari 공유 → 마크업으로 PDF를 저장할 수도 있습니다.</p><p>PDF는 읽기·출력용입니다. 앱 데이터 복원이 필요할 때는 별도의 JSON 백업 파일을 사용하세요.</p></div></header><main>${reportHTML}</main></body></html>`);
  win.document.close();

function backupPage(){
  const reportButtons=projects.length?projects.slice().sort((a,b)=>b.created-a.created).map(p=>`<div class="bar" style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="min-width:0"><strong>${esc(p.name)}</strong><div class="muted small">사진 ${photos.filter(x=>x.projectId===p.id).length}장 · 작업일지 ${notes.filter(x=>x.projectId===p.id).length}건</div></div><button class="btn-outline small" onclick="makeReport('${p.id}')">PDF 보기·저장</button></div>`).join(''):'<div class="empty">등록된 프로젝트가 없습니다. 먼저 현장을 추가해 주세요.</div>';
  app.innerHTML=`<h1>백업 · 설정</h1><p class="muted">현장 기록은 현재 기기의 앱 저장공간에 보관됩니다. <strong>PDF는 열어보는 문서</strong>, <strong>JSON은 앱 복원용 파일</strong>입니다. 둘 다 iCloud Drive에 보관하는 것을 권장합니다.</p><div class="item"><h2>현장 보고서 PDF</h2><p class="muted small">현장 사진·스케치 이미지·작업일지·보수 관리 내용을 PDF로 볼 수 있게 정리합니다. 아이폰에서 <strong>PDF 보기·저장 → 인쇄 / PDF 저장 → 공유 → 파일에 저장 → iCloud Drive → 현장노트</strong> 순서로 저장하세요. PDF가 자동으로 iCloud에 올라가지는 않습니다.</p>${reportButtons}${projects.length?'<button class="btn" style="margin-top:12px;width:100%" onclick="makeReport(\'all\')">전체 프로젝트 PDF로 보기·저장</button>':''}<p class="note">PDF에는 사진과 텍스트 메모가 포함됩니다. 녹음한 음성 파일 자체는 포함되지 않습니다. PDF 파일은 앱에 기록을 복원하는 용도로 사용할 수 없습니다.</p></div><div class="item"><h2>앱 복구용 백업(JSON)</h2><p class="muted small">JSON은 사람이 읽기 위한 문서가 아니라 <strong>프로젝트·사진 원본·스케치·작업일지·보수·음성 파일을 다시 앱에 넣기 위한 복구용 백업</strong>입니다. 삭제하지 말고 iCloud Drive에 따로 보관해 주세요.</p><div class="row"><button class="btn-outline" onclick="exportBackup()">복원용 JSON 파일 다운로드</button><button class="btn-outline" onclick="shareBackup()">공유 메뉴로 보내기</button></div><p id="backupStatus" class="note" role="status" aria-live="polite">다운로드한 JSON 파일은 파일 앱에서 확인한 후 iCloud Drive → 현장노트 폴더로 저장하세요. 이 앱은 iCloud 저장 완료 여부를 직접 확인할 수 없습니다.</p></div><div class="item"><h2>JSON 백업에서 복원</h2><p class="muted small">iCloud Drive 또는 컴퓨터에 보관한 JSON(.json 또는 .txt) 백업 파일을 선택하세요. 기존 기록에 백업 내용을 합치며 동일한 ID는 백업 파일의 내용으로 교체됩니다.</p><button class="btn-outline" onclick="$('#importBackup').click()">JSON 백업 파일 선택·복원</button></div><div class="item"><h2>사진 앨범 분리</h2><p>현장노트 카메라로 촬영한 사진은 기본 사진 앱에 자동 저장되지 않습니다. 앱 내부 저장소에 저장되며 위 JSON 백업 파일에 포함됩니다.</p><p class="note">브라우저 데이터 삭제·휴대폰 교체·저장공간 정리 등으로 앱 내부 기록이 사라질 수 있으므로 정기적으로 JSON 백업을 보관하세요.</p></div><div class="item"><h2>아이폰 설치</h2><p>HTTPS 주소에서 Safari로 열기 → 공유 → 홈 화면에 추가 → 추가</p></div>`;
}

function backupPayload(){let all={app:'site-note',version:1,exportedAt:new Date().toISOString()};const snapshot={projects,photos,notes,tasks,audios};for(const n of schema)all[n]=snapshot[n];return JSON.stringify(all)}
function backupName(ext='json'){const now=new Date(),pad=n=>String(n).padStart(2,'0');return `site-note-backup-${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}.${ext}`}
function showBackupStatus(message){const el=$('#backupStatus');if(el)el.textContent=message}
function exportBackup(){try{const blob=new Blob([backupPayload()],{type:'application/json'});const url=URL.createObjectURL(blob);downloadFile(url,backupName());showBackupStatus('백업 파일 다운로드를 요청했습니다. 다운로드된 파일을 파일 앱에서 찾아 iCloud Drive → 현장노트 폴더로 이동해 주세요. 앱에서 직접 저장 여부를 확인할 수는 없습니다.');setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){toast('백업 파일 생성 실패: '+e.message)}}
async function shareBackup(){let json;try{json=backupPayload()}catch(e){toast('백업 파일 생성 실패: '+e.message);return}let file=null;try{if(typeof navigator.share==='function'&&typeof navigator.canShare==='function'&&typeof File==='function'){const candidates=[new File([json],backupName('json'),{type:'application/json'}),new File([json],backupName('txt'),{type:'text/plain'})];for(const candidate of candidates){if(navigator.canShare({files:[candidate]})){file=candidate;break}}}}catch(e){file=null}if(!file){showBackupStatus('이 브라우저는 백업 파일 공유를 지원하지 않습니다. JSON 파일 다운로드로 전환합니다. Safari 다운로드 위치가 iCloud Drive인지 확인해 주세요.');exportBackup();return}try{await navigator.share({files:[file]});showBackupStatus('백업 파일 공유가 종료되었습니다. iCloud Drive 저장 여부는 확인할 수 없습니다. 파일 앱 → iCloud Drive → 현장노트에서 생성된 파일을 확인해 주세요.')}catch(e){if(e.name==='AbortError')showBackupStatus('공유가 취소되었습니다. iCloud Drive에는 아직 저장되지 않았을 수 있습니다.');else{showBackupStatus('공유에 실패했습니다. 오른쪽 “백업 파일 다운로드” 버튼을 이용해 주세요.');toast('공유 실패: '+e.message)}}}
$('#importBackup').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.app!=='site-note'||!schema.every(k=>Array.isArray(data[k])))throw Error('올바른 현장노트 백업 파일이 아닙니다.');if(!confirm('현재 데이터에 백업 내용을 합치시겠습니까?'))return;for(let n of schema)for(let item of data[n])await request(tx(n,'readwrite').put(item));await refresh();toast('복원이 완료되었습니다.')}catch(err){toast('복원 실패: '+err.message)}finally{e.target.value=''}};document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.nav));async function main(){if(!window.indexedDB){app.innerHTML='<div class="empty">이 브라우저는 앱 저장소를 지원하지 않습니다.</div>';return}try{db=await openDB();await refresh();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){app.innerHTML='<div class="empty">앱 저장소 접근에 실패했습니다. Safari 개인정보 보호 설정을 확인하세요.</div>'}}main();
</script></body></html>
