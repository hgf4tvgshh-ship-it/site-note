'use strict';const $=s=>document.querySelector(s), app=$('#app'), overlay=$('#overlay'), modal=$('#modal');let db,view='home',projectId=null,tab='photos',cameraStream=null,recorder=null,recordChunks=[],drawState=null;let projects=[],photos=[],notes=[],tasks=[],audios=[];const uid=()=>crypto.randomUUID?.()||'id'+Date.now()+Math.random().toString(16).slice(2);const date=()=>{const d=new Date(),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};const fmt=t=>new Date(t).toLocaleString('ko-KR');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){alert(s)}
const schema=['projects','photos','notes','tasks','audios'];function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('site-note-db',1);r.onupgradeneeded=()=>schema.forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function tx(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function request(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function getAll(n){return request(tx(n).getAll())}async function put(n,o){await request(tx(n,'readwrite').put(o));markBackupDataChanged();await refresh()}async function del(n,id){await request(tx(n,'readwrite').delete(id));markBackupDataChanged();await refresh()}async function refresh(){[projects,photos,notes,tasks,audios]=await Promise.all(schema.map(getAll));render()}

// 백업 알림은 이 실행 환경의 저장소에만 기록됩니다. iCloud 저장 성공 여부는 파일 앱에서 사용자가 직접 확인해야 합니다.
const backupInfoKey='site-note-backup-info-v1',backupReminderDays=7;
function readBackupInfo(){
  try{const item=JSON.parse(localStorage.getItem(backupInfoKey)||'{}');return item&&typeof item==='object'?item:{}}
  catch(e){return {}}
}
function writeBackupInfo(info){try{localStorage.setItem(backupInfoKey,JSON.stringify(info))}catch(e){}}
function markBackupDataChanged(){const info=readBackupInfo();info.changedAt=Date.now();writeBackupInfo(info)}
function markBackupFilePrepared(){
  const info=readBackupInfo();info.exportedAt=Date.now();info.exportedChangeAt=info.changedAt||0;
  writeBackupInfo(info);updateBackupReminder();
}
function backupReminderState(){
  const info=readBackupInfo(),hasData=projects.length+photos.length+notes.length+tasks.length+audios.length>0;
  const last=Number(info.confirmedExportAt)||0;
  const changed=last>0&&(Number(info.changedAt)||0)>(Number(info.confirmedChangeAt)||0);
  const due=last>0&&Date.now()-last>=backupReminderDays*24*60*60*1000;
  let status='백업할 기록 없음',description='현장을 등록하면 백업 상태를 안내합니다.',urgent=false;
  if(hasData&&!last){status='첫 JSON 백업이 필요합니다';description='현장 기록이 있습니다. iCloud Drive에 복구용 JSON 파일을 보관해 주세요.';urgent=true}
  else if(hasData&&changed){status='변경된 기록의 백업이 필요합니다';description='마지막 확인 이후 현장 기록이 추가·수정·삭제되었습니다.';urgent=true}
  else if(hasData&&due){status='7일이 지나 백업을 권장합니다';description='마지막 백업을 확인한 후 7일 이상 지났습니다.';urgent=true}
  else if(last){status='최근 백업 확인 완료';description='이 앱에서 확인한 백업 이후 기록 변경이 감지되지 않았습니다.'}
  return {info,last,status,description,urgent};
}
function backupReminderInner(home=false){
  const {info,last,status,description,urgent}=backupReminderState();
  const stamp=last?fmt(last):'확인 기록 없음';
  const pending=Number(info.exportedAt)>Number(info.confirmedExportAt||0);
  const background=urgent?'#fff8ed':'#edf5ef',edge=urgent?'#ecd1a8':'#d8e9df';
  return `<div style="border:1px solid ${edge};background:${background};border-radius:15px;padding:16px;margin:15px 0">
    <div class="row space"><strong>${urgent?'● ': '✓ '}${status}</strong><small class="muted">7일 주기 안내</small></div>
    <p class="small" style="margin:9px 0">${description}</p>
    <div class="small muted">마지막 확인된 JSON 백업: <strong>${esc(stamp)}</strong></div>
    ${home?`<button class="btn-light small" style="margin-top:12px" onclick="go('backup')">JSON 백업하러 가기</button>`:
    `<p class="note" style="margin-top:11px">다운로드하거나 공유한 것만으로 백업 완료로 처리하지 않습니다. 파일 앱에서 실제 파일을 확인한 뒤 아래 버튼을 눌러 주세요.</p>
     <button class="btn-light small" onclick="confirmBackupSaved()" ${pending?'':'disabled'} style="margin-top:4px;${pending?'':'opacity:.45'}">파일 앱에서 저장 확인했어요 · 백업 완료 기록</button>`}
  </div>`;
}
function updateBackupReminder(){const area=document.getElementById('backupReminder');if(area)area.innerHTML=backupReminderInner(view==='home')}
function confirmBackupSaved(){
  const info=readBackupInfo();
  if(!info.exportedAt||info.exportedAt<=Number(info.confirmedExportAt||0)){
    toast('먼저 JSON 파일 다운로드 또는 공유를 실행하고 파일 앱에서 확인해 주세요.');return;
  }
  if(!confirm('파일 앱 → iCloud Drive → 현장노트 폴더에서 방금 만든 JSON(.json 또는 .txt) 파일을 실제로 확인하셨나요?'))return;
  info.confirmedExportAt=info.exportedAt;
  info.confirmedChangeAt=info.exportedChangeAt||0;
  writeBackupInfo(info);updateBackupReminder();
  toast('마지막 백업 확인 날짜를 기록했습니다. 이 기기에서만 표시되며, 백업 파일이 자동 동기화되는 것은 아닙니다.');
}

function showModal(html){overlay.classList.toggle('editor-mode',!!html.editor);modal.innerHTML=`<div class="modal-head"><h2>${html.title}</h2><button class="close" onclick="closeModal()">✕</button></div>${html.body}`;overlay.classList.remove('hidden')}function closeModal(force=false){if(!force&&drawState?.dirty&&!confirm('저장하지 않은 스케치가 있습니다. 저장하지 않고 닫으시겠습니까?'))return;overlay.classList.add('hidden');overlay.classList.remove('editor-mode');drawState?.cleanup?.();if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}drawState=null}overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});$('#today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'});
function go(v){view=v;projectId=null;render()}function openProject(id){projectId=id;view='project';tab='photos';render()}function nav(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.nav===view||(view==='project'&&n.dataset.nav==='home')))}function render(){nav();if(view==='home')return home();if(view==='project')return project();if(view==='tasks')return taskPage();if(view==='backup')return backupPage()}
function home(){let active=tasks.filter(t=>t.status!=='완료').length;app.innerHTML=`<div class="hero"><div><div class="muted small">현장의 모든 기록을 한곳에</div><h1>나의 현장</h1><div class="muted small">사진 · 스케치 · 작업일지 · 보수관리</div></div><button class="btn" onclick="newProject()">+ 현장 추가</button></div><div class="grid"><div class="metric"><span class="muted small">전체 현장</span><strong>${projects.length}</strong></div><div class="metric"><span class="muted small">보관 사진</span><strong>${photos.length}</strong></div><div class="metric"><span class="muted small">미완료 보수</span><strong>${active}</strong></div><div class="metric"><span class="muted small">현장 기록</span><strong>${notes.length}</strong></div></div><div id="backupReminder">${backupReminderInner(true)}</div><div class="section-title"><h2>프로젝트</h2><span class="muted small">최근 생성 순</span></div>${projects.length?projects.slice().sort((a,b)=>b.created-a.created).map(p=>`<div class="project" onclick="openProject('${p.id}')"><div class="project-top"><h3>${esc(p.name)}</h3><div class="row"><span class="pill">${esc(p.status||'진행중')}</span><button class="btn-delete small" aria-label="${esc(p.name)} 삭제" onclick="event.stopPropagation();deleteProjectPrompt('${p.id}')">삭제</button></div></div><p class="muted small">${esc(p.address||'주소 미입력')} · ${esc(p.period||'공사기간 미입력')}</p><div class="row small muted"><span>사진 ${photos.filter(x=>x.projectId===p.id).length}장</span><span>·</span><span>기록 ${notes.filter(x=>x.projectId===p.id).length}건</span><span>·</span><span>보수 ${tasks.filter(x=>x.projectId===p.id&&x.status!=='완료').length}건</span></div></div>`).join(''):`<div class="empty">아직 등록된 현장이 없습니다.<p>첫 번째 프로젝트를 등록해 주세요.</p><button class="btn" onclick="newProject()">+ 첫 현장 만들기</button></div>`}`}
function newProject(){showModal({title:'새 프로젝트',body:`<form id="projectForm"><div class="form-col"><label>현장명 *</label><input name="name" maxlength="80" required placeholder="예: 상무동 카페 리뉴얼"></div><div class="form-col"><label>현장 주소</label><input name="address" placeholder="예: 광주 서구 ..."></div><div class="form-col"><label>공사기간</label><input name="period" placeholder="예: 2026.11.20 ~ 2026.12.20"></div><div class="form-col"><label>담당자</label><input name="manager" placeholder="이름 또는 팀"></div><button class="btn" style="width:100%">프로젝트 저장</button></form>`});$('#projectForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),id=uid();await put('projects',{id,name:f.get('name').trim(),address:f.get('address').trim(),period:f.get('period').trim(),manager:f.get('manager').trim(),status:'진행중',created:Date.now()});closeModal();openProject(id)}}

function editorClamp(n,min,max){return Math.max(min,Math.min(max,n))}
function editorPhotoPos(e,canvas){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height,inside:e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}}

function editorTransform(){

function editorZoomAt(next,clientX,clientY){

function drawArrow(c,a,b){

}

// 사용자의 기기 내부에서 PDF 파일을 직접 만듭니다. 외부 라이브러리/서버는 사용하지 않습니다.
let preparedReportPDF=null;
const pdfReportFont='-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
function pdfReportDate(t){try{return new Date(t).toLocaleDateString('ko-KR')}catch(e){return ''}}
function pdfReportWrap(ctx,str,maxWidth){
  const result=[];
  for(const paragraph of String(str??'').replace(/\r/g,'').split('\n')){
    if(!paragraph){result.push('');continue}
    let line='';
    for(const char of paragraph){
      const test=line+char;
      if(line&&ctx.measureText(test).width>maxWidth){result.push(line);line=char}else line=test;
    }
    if(line)result.push(line);
  }
  return result;
}
function pdfReportImage(src){return new Promise((resolve,reject)=>{
  if(!src)return resolve(null);
  const im=new Image();
  im.onload=()=>resolve(im);
  im.onerror=()=>reject(Error('이미지를 불러오지 못했습니다.'));
  im.src=src;
})}
function pdfReportBytes(base64){
  const bin=atob(base64),arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return arr;
}
function pdfReportAssemble(pages){
  if(!pages.length)throw Error('PDF로 저장할 페이지가 없습니다.');
  const enc=new TextEncoder(),chunks=[],offsets=[0];let total=0;
  function push(data){chunks.push(data);total+=data.length}
  function put(str){push(enc.encode(str))}
  function obj(id,content){offsets[id]=total;put(id+' 0 obj\n'+content+'\nendobj\n')}
  put('%PDF-1.4\n%PDFSITE\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  const kids=pages.map((_,i)=>(3+i*3)+' 0 R').join(' ');
  obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`);
  for(let i=0;i<pages.length;i++){
    const n=3+i*3,page=pages[i],contents='q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n';
    obj(n,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${n+2} 0 R >> >> /Contents ${n+1} 0 R >>`);
    obj(n+1,`<< /Length ${enc.encode(contents).length} >>\nstream\n${contents}endstream`);
    offsets[n+2]=total;
    put(`${n+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${page.width} /Height ${page.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${page.jpeg.length} >>\nstream\n`);
    push(page.jpeg);
    put('\nendstream\nendobj\n');
  }
  const start=total;
  put(`xref\n0 ${pages.length*3+3}\n0000000000 65535 f \n`);
  for(let i=1;i<=pages.length*3+2;i++)put(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
  put(`trailer\n<< /Size ${pages.length*3+3} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`);
  const all=new Uint8Array(total);let p=0;
  for(const chunk of chunks){all.set(chunk,p);p+=chunk.length}

}
async function pdfReportBuild(selected){
  const W=1120,H=1584,M=66,RIGHT=W-M,BOTTOM=H-80,ink='#23312d',gray='#71817a',green='#246650';
  const pages=[];let cvs=null,ctx=null,y=0,number=0;
  function fill(x,yy,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,yy,w,h)}
  function font(px,bold=false,color=ink){ctx.font=(bold?'700 ':'400 ')+px+'px '+pdfReportFont;ctx.fillStyle=color;ctx.textBaseline='top'}
  function line(str,x,yy,px=23,bold=false,color=ink){font(px,bold,color);ctx.fillText(str,x,yy)}
  function fresh(){
    cvs=document.createElement('canvas');cvs.width=W;cvs.height=H;
    ctx=cvs.getContext('2d',{alpha:false});fill(0,0,W,H,'#ffffff');number++;
    line('SITE NOTE  /  FIELD REPORT',M,31,20,true,green);
    fill(M,75,RIGHT-M,2,'#cfddd5');y=104;
  }
  function finish(){
    if(!cvs)return;
    fill(M,H-59,RIGHT-M,1,'#e2e8e4');
    line('현장노트 · 조회용 PDF  |  원본 복원은 JSON 백업 사용',M,H-47,15,false,gray);
    line(String(number),RIGHT-24,H-47,15,false,gray);
    const jpg=cvs.toDataURL('image/jpeg',0.87);
    pages.push({width:W,height:H,jpeg:pdfReportBytes(jpg.split(',')[1])});
    cvs.width=1;cvs.height=1;
  }
  function need(height){if(y+height>BOTTOM){finish();fresh()}}
  function text(str,indent=0,px=23,lh=34,color=ink,bold=false){
    font(px,bold,color);
    const rows=pdfReportWrap(ctx,str,RIGHT-M-indent);
    for(const item of rows){need(lh);line(item,M+indent,y,px,bold,color);y+=lh}
  }
  function title(t){need(76);line(t,M,y,27,true,green);y+=49;fill(M,y,RIGHT-M,1,'#cedbd2');y+=21}
  function detail(head,desc,meta){
    need(102);line(head,M,y,23,true,ink);y+=37;
    if(meta){text(meta,0,18,27,gray)}
    text(desc||'내용 없음',0,20,31,ink);y+=21;
  }
  function padding(){need(35);y+=29}
  fresh();
  for(const p of selected){
    need(250);line(p.name||'이름 없는 현장',M,y,39,true,ink);y+=64;
    text('현장 주소  '+(p.address||'미입력'),0,21,35);
    text('공사기간  '+(p.period||'미입력'),0,21,35);
    text('담당자  '+(p.manager||'미입력'),0,21,35);
    text('작성일  '+date(),0,21,35);y+=23;
    const ps=photos.filter(x=>x.projectId===p.id).sort((a,b)=>a.created-b.created);
    const ns=notes.filter(x=>x.projectId===p.id).sort((a,b)=>a.created-b.created);
    const ts=tasks.filter(x=>x.projectId===p.id).sort((a,b)=>a.created-b.created);
    const aud=audios.filter(x=>x.projectId===p.id).sort((a,b)=>a.created-b.created);
    need(65);fill(M,y,RIGHT-M,50,'#eaf3ed');
    line(`사진 ${ps.length}     작업일지 ${ns.length}     보수 ${ts.length}     음성 ${aud.length}`,M+17,y+11,22,true,green);y+=84;
    title('01 / 현장 사진');
    if(!ps.length)text('현장 사진 없음',0,20,32,gray);
    const GAP=24,CW=(RIGHT-M-GAP)/2,PH=310;
    for(let i=0;i<ps.length;i++){
      need(455);const item=ps[i],rowTop=y;
      const imgs=item.preview?[item.original,item.preview]:[item.original];
      for(let j=0;j<imgs.length;j++){
        const x=M+j*(CW+GAP);fill(x,rowTop,CW,PH,'#f2f5f3');
        try{const im=await pdfReportImage(imgs[j]);if(im){const scale=Math.min(CW/im.width,PH/im.height),iw=im.width*scale,ih=im.height*scale;ctx.drawImage(im,x+(CW-iw)/2,rowTop+(PH-ih)/2,iw,ih)}}
        catch(e){line('사진 읽기 실패',x+20,rowTop+20,19,false,gray)}
        line(item.preview?(j===0?'원본':'스케치본'):'원본',x,rowTop+PH+8,18,true,green);
      }
      y=rowTop+PH+35;
      text(`${i+1}. ${item.label||'현장 사진'}`,0,20,27,ink,true);
      text(`${item.trade||'미분류'} / ${pdfReportDate(item.created)}`,0,17,25,gray);
      if(item.memo)text(item.memo,0,18,26,ink);
      y=Math.max(y,rowTop+455);
    }
    padding();title('02 / 작업일지');
    if(!ns.length)text('작성된 작업일지 없음',0,20,32,gray);
    for(const n of ns){detail(n.title||'작업 기록',n.content,n.trade+' / '+pdfReportDate(n.created))}
    padding();title('03 / 보수 관리');
    if(!ts.length)text('등록된 보수 기록 없음',0,20,32,gray);
    for(const t of ts){detail(t.title||'보수 기록',t.content,(t.status||'요청')+' / '+(t.owner||'담당 미정'))}
    if(aud.length){padding();title('04 / 음성 메모 텍스트');for(const a of aud)detail(a.title||'음성 메모',a.text||'(텍스트 기록 없음. 음성 파일은 PDF에 포함되지 않습니다.)',pdfReportDate(a.created))}
    // 두 프로젝트의 내용이 같은 페이지에서 겹치지 않도록 분리

  }
  finish();
  return pdfReportAssemble(pages);
}
function pdfReportFilename(name){

}
async function createDirectPdf(id){

  }catch(e){showModal({title:'PDF 만들기 실패',body:`<p class="danger">${esc(e.message)}</p><p>기존 현장 데이터는 변경되지 않았습니다.</p>`})}

async function shareDirectPdf(){
  if(!preparedReportPDF)return;
  const {blob,filename}=preparedReportPDF,el=$('#pdfSaveStatus');
  try{
    const f=new File([blob],filename,{type:'application/pdf'});
    if(typeof navigator.share==='function'&&(!navigator.canShare||navigator.canShare({files:[f]}))){
      await navigator.share({files:[f],title:filename});

    }

    if(el)el.textContent=e.name==='AbortError'?'공유가 취소되었습니다.':'파일 공유 실패: '+e.message+' — 오른쪽 PDF 열기·다운로드를 이용하세요.';
  }

function openDirectPdf(){

function backupPage(){
  const reportButtons=projects.length?projects.slice().sort((a,b)=>b.created-a.created).map(p=>`<div class="bar" style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="min-width:0"><strong>${esc(p.name)}</strong><div class="muted small">사진 ${photos.filter(x=>x.projectId===p.id).length}장 · 작업일지 ${notes.filter(x=>x.projectId===p.id).length}건</div></div><button class="btn-outline small" onclick="createDirectPdf('${p.id}')">PDF 파일 만들기</button></div>`).join(''):'<div class="empty">등록된 프로젝트가 없습니다. 먼저 현장을 추가해 주세요.</div>';
  app.innerHTML=`<h1>백업 · 설정</h1><div id="backupReminder">${backupReminderInner(false)}</div><p class="muted">현장 기록은 현재 기기의 앱 저장공간에 보관됩니다. <strong>PDF는 열어보는 문서</strong>, <strong>JSON은 앱 복원용 파일</strong>입니다. 둘 다 iCloud Drive에 보관하는 것을 권장합니다.</p><div class="item"><h2>현장 보고서 PDF</h2><p class="muted small">현장 사진·스케치 이미지·작업일지·보수 관리 내용을 PDF로 볼 수 있게 정리합니다. 아이폰에서 <strong>PDF 파일 만들기 → iCloud에 저장하기(공유) → 파일에 저장 → iCloud Drive → 현장노트</strong> 순서로 저장하세요. PDF 파일은 직접 만들어지지만 iCloud Drive에 저장하려면 공유 메뉴에서 저장을 선택해야 합니다.</p>${reportButtons}${projects.length?'<button class="btn" style="margin-top:12px;width:100%" onclick="createDirectPdf(\'all\')">전체 프로젝트 PDF 파일 만들기</button>':''}<p class="note">PDF에는 원본과 스케치본을 비교할 수 있도록 보고서에 나란히 배치합니다. 사진과 텍스트 메모는 이미지 기반 페이지로 포함됩니다. 글자 검색·복사는 제한될 수 있습니다. 녹음한 음성 파일 자체는 포함되지 않습니다. PDF 파일은 앱에 기록을 복원하는 용도로 사용할 수 없습니다.</p></div><div class="item"><h2>현장 데이터 백업 (JSON 저장하기)</h2><p class="muted small">다운로드와 공유는 같은 내용의 백업을 저장하는 두 가지 방법입니다. 평소에는 둘 중 하나만 사용하면 됩니다. JSON은 사람이 읽기 위한 문서가 아니라 <strong>프로젝트·사진 원본·스케치·작업일지·보수·음성 파일을 다시 앱에 넣기 위한 복구용 백업</strong>입니다. 삭제하지 말고 iCloud Drive에 따로 보관해 주세요.</p><div class="row"><button class="btn-outline" onclick="exportBackup()">JSON 파일 다운로드</button><button class="btn-outline" onclick="shareBackup()">iCloud에 백업하기 (공유)</button></div><p id="backupStatus" class="note" role="status" aria-live="polite">다운로드한 JSON 파일은 파일 앱에서 확인한 후 iCloud Drive → 현장노트 폴더로 저장하세요. 이 앱은 iCloud 저장 완료 여부를 직접 확인할 수 없습니다.</p></div><div class="item"><h2>저장한 JSON 파일로 복원하기</h2><p class="muted small">iCloud Drive 또는 컴퓨터에 보관한 JSON(.json 또는 .txt) 백업 파일을 선택하세요. 휴대폰 변경이나 기록 복구가 필요할 때만 사용합니다. 현재 기록에 백업 내용을 합치며 동일한 ID는 백업 파일 내용으로 교체되므로, 복원 전 현재 데이터도 백업하세요.</p><button class="btn-outline" onclick="$('#importBackup').click()">JSON 파일 불러와 복원</button></div><div class="item"><h2>사진 앨범 분리</h2><p>현장노트 카메라로 촬영한 사진은 기본 사진 앱에 자동 저장되지 않습니다. 앱 내부 저장소에 저장되며 위 JSON 백업 파일에 포함됩니다.</p><p class="note">브라우저 데이터 삭제·휴대폰 교체·저장공간 정리 등으로 앱 내부 기록이 사라질 수 있으므로 정기적으로 JSON 백업을 보관하세요.</p></div><div class="item"><h2>아이폰 설치</h2><p>HTTPS 주소에서 Safari로 열기 → 공유 → 홈 화면에 추가 → 추가</p></div>`;
}

function backupPayload(){let all={app:'site-note',version:1,exportedAt:new Date().toISOString()};const snapshot={projects,photos,notes,tasks,audios};for(const n of schema)all[n]=snapshot[n];return JSON.stringify(all)}
function backupName(ext='json'){const now=new Date(),pad=n=>String(n).padStart(2,'0');return `site-note-backup-${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}.${ext}`}
function showBackupStatus(message){const el=$('#backupStatus');if(el)el.textContent=message}
function exportBackup(){try{const blob=new Blob([backupPayload()],{type:'application/json'});const url=URL.createObjectURL(blob);downloadFile(url,backupName());markBackupFilePrepared();showBackupStatus('백업 파일 다운로드를 요청했습니다. 다운로드된 파일을 파일 앱에서 찾아 iCloud Drive → 현장노트 폴더로 이동해 주세요. 앱에서 직접 저장 여부를 확인할 수는 없습니다.');setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){toast('백업 파일 생성 실패: '+e.message)}}
async function shareBackup(){let json;try{json=backupPayload()}catch(e){toast('백업 파일 생성 실패: '+e.message);return}let file=null;try{if(typeof navigator.share==='function'&&typeof navigator.canShare==='function'&&typeof File==='function'){const candidates=[new File([json],backupName('json'),{type:'application/json'}),new File([json],backupName('txt'),{type:'text/plain'})];for(const candidate of candidates){if(navigator.canShare({files:[candidate]})){file=candidate;break}}}}catch(e){file=null}if(!file){showBackupStatus('이 브라우저는 백업 파일 공유를 지원하지 않습니다. JSON 파일 다운로드로 전환합니다. Safari 다운로드 위치가 iCloud Drive인지 확인해 주세요.');exportBackup();return}try{await navigator.share({files:[file]});markBackupFilePrepared();showBackupStatus('백업 파일 공유가 종료되었습니다. iCloud Drive 저장 여부는 확인할 수 없습니다. 파일 앱 → iCloud Drive → 현장노트에서 생성된 파일을 확인해 주세요.')}catch(e){if(e.name==='AbortError')showBackupStatus('공유가 취소되었습니다. iCloud Drive에는 아직 저장되지 않았을 수 있습니다.');else{showBackupStatus('공유에 실패했습니다. 오른쪽 “백업 파일 다운로드” 버튼을 이용해 주세요.');toast('공유 실패: '+e.message)}}}
$('#importBackup').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.app!=='site-note'||!schema.every(k=>Array.isArray(data[k])))throw Error('올바른 현장노트 백업 파일이 아닙니다.');if(!confirm('현재 데이터에 백업 내용을 합치시겠습니까?'))return;for(let n of schema)for(let item of data[n])await request(tx(n,'readwrite').put(item));markBackupDataChanged();await refresh();toast('복원이 완료되었습니다.')}catch(err){toast('복원 실패: '+err.message)}finally{e.target.value=''}};document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.nav));async function main(){if(!window.indexedDB){app.innerHTML='<div class="empty">이 브라우저는 앱 저장소를 지원하지 않습니다.</div>';return}try{db=await openDB();await refresh();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){app.innerHTML='<div class="empty">앱 저장소 접근에 실패했습니다. Safari 개인정보 보호 설정을 확인하세요.</div>'}}main();
</script></body></html>
